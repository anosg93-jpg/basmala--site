<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاجأة لبسمولة</title>
    <style>
        :root {
            --primary-pink: #ff85a1;
            --dark-pink: #d63384;
            --ramadan-gold: #ffd700;
            --ramadan-blue: #1a2a6c;
        }
        body {
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: linear-gradient(135deg, #ffc1cf 0%, #ffebf1 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden; color: var(--dark-pink); transition: 1s;
        }
        
        /* التنسيقات العامة */
        #login-screen, #main-content, #ramadan-screen {
            text-align: center; z-index: 10;
        }

        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffc1cf; display: flex; justify-content: center; align-items: center; z-index: 100;
        }

        .box { 
            background: rgba(255, 255, 255, 0.85); padding: 30px; border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); border: 2px solid white;
            max-width: 450px; width: 90%; margin: auto;
        }

        input, textarea { 
            padding: 12px; border: 2px solid var(--primary-pink); border-radius: 15px; width: 100%;
            text-align: center; margin-bottom: 20px; font-size: 18px; outline: none; box-sizing: border-box;
        }
        
        .btn-main, .action-btn { 
            padding: 12px 30px; background: var(--dark-pink); color: white; border: none; 
            border-radius: 25px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s;
        }

        /* قسم الصور */
        .image-container { display: flex; justify-content: center; gap: 15px; margin: 20px 0; flex-wrap: wrap; }
        .love-img {
            width: 130px; height: 130px; object-fit: cover; border-radius: 20px; border: 3px solid white;
            box-shadow: 0 8px 20px rgba(214, 51, 132, 0.2); animation: float 3s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* الأقسام المخفية */
        #main-content, #letter-section, #wish-section, #ramadan-screen { display: none; }

        .love-letter { font-size: 1.1rem; line-height: 1.8; color: #444; margin: 15px 0; }
        
        .counter-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 20px; }
        .time-box { background: white; padding: 10px 5px; border-radius: 15px; border-bottom: 3px solid var(--primary-pink); }
        .time-num { font-size: 1rem; font-weight: bold; display: block; }

        /* شاشة رمضان */
        #ramadan-screen h1 { font-size: 2.5rem; color: var(--ramadan-gold); text-shadow: 2px 2px 10px rgba(0,0,0,0.3); }
