<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاجأة لبسمولة</title>
    <style>
        :root {
            --primary-pink: #ff85a1;
            --dark-pink: #d63384;
            --ramadan-gold: #ffd700;
            --ramadan-blue: #1a2a6c;
        }
        body {
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: linear-gradient(135deg, #ffc1cf 0%, #ffebf1 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden; color: var(--dark-pink); transition: 1s;
        }
        
        /* التنسيقات العامة */
        #login-screen, #main-content, #ramadan-screen {
            text-align: center; z-index: 10;
        }

        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffc1cf; display: flex; justify-content: center; align-items: center; z-index: 100;
        }

        .box { 
            background: rgba(255, 255, 255, 0.85); padding: 30px; border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); border: 2px solid white;
            max-width: 450px; width: 90%; margin: auto;
        }

        input, textarea { 
            padding: 12px; border: 2px solid var(--primary-pink); border-radius: 15px; width: 100%;
            text-align: center; margin-bottom: 20px; font-size: 18px; outline: none; box-sizing: border-box;
        }
        
        .btn-main, .action-btn { 
            padding: 12px 30px; background: var(--dark-pink); color: white; border: none; 
            border-radius: 25px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s;
        }

        /* قسم الصور */
        .image-container { display: flex; justify-content: center; gap: 15px; margin: 20px 0; flex-wrap: wrap; }
        .love-img {
            width: 130px; height: 130px; object-fit: cover; border-radius: 20px; border: 3px solid white;
            box-shadow: 0 8px 20px rgba(214, 51, 132, 0.2); animation: float 3s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* الأقسام المخفية */
        #main-content, #letter-section, #wish-section, #ramadan-screen { display: none; }

        .love-letter { font-size: 1.1rem; line-height: 1.8; color: #444; margin: 15px 0; }
        
        .counter-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 20px; }
        .time-box { background: white; padding: 10px 5px; border-radius: 15px; border-bottom: 3px solid var(--primary-pink); }
        .time-num { font-size: 1rem; font-weight: bold; display: block; }

        /* شاشة رمضان */
        #ramadan-screen h1 { font-size: 2.5rem; color: var(--ramadan-gold); text-shadow: 2px 2px 10px rgba(0,0,0,0.3); }
        .moon { font-size: 80px; margin-bottom: 10px; display: block; filter: drop-shadow(0 0 15px gold); }

        /* العناصر التي تقع */
        .falling-item { position: absolute; top: -10%; pointer-events: none; z-index: 1; animation: fall linear infinite; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="box">
            <div style="font-size: 40px;">🌸</div>
            <h3>اكتبي كلمه السر يا بسمولتي 🤫</h3>
            <input type="password" id="passwordInput" autocomplete="off">
            <button class="btn-main" onclick="checkPassword()">دخول ✨</button>
        </div>
    </div>

    <div id="main-content" class="box">
        <div id="heart-icon" style="font-size: 40px;">❤️</div>
        
        <div id="images-section">
            <div class="image-container">
                <img src="love1.jpg" alt="Love 1" class="love-img">
                <img src="love2.jpg" alt="Love 2" class="love-img">
            </div>
            <button class="action-btn" onclick="showLetter()">اضغطي هنا ي بسبوسه 💌</button>
        </div>

        <div id="letter-section">
            <div id="typewriter" class="love-letter"></div>
            <div class="counter-container">
                <div class="time-box"><span class="time-num" id="days">0</span><span class="time-label">يوم</span></div>
                <div class="time-box"><span class="time-num" id="hours">0</span><span class="time-label">ساعة</span></div>
                <div class="time-box"><span class="time-num" id="minutes">0</span><span class="time-label">دقيقة</span></div>
                <div class="time-box"><span class="time-num" id="seconds">0</span><span class="time-label">ثانية</span></div>
            </div>
            <button id="wish-start-btn" class="action-btn" style="display:none; margin-top: 25px; font-size: 15px;" onclick="showWishSection()">اضغطي هنا اجمل بسمولة في الدنيا ✨</button>
        </div>

        <div id="wish-section">
            <h3>اتمني امنيه يا حبيبتي 🌙</h3>
            <p style="font-size: 13px; color: #666;">اكتبي اللي في قلبك ومحدش هيشوفه غيرك..</p>
            <textarea id="wishText" placeholder="أمنيتك هي..."></textarea>
            <button id="send-wish-btn" class="action-btn" onclick="finishWish()">إرسال الأمنية ❤️</button>
            <div id="after-wish" style="display:none; margin-top:20px;">
                <p>ربنا يتقبل منك يا روحي.. جاهزة لآخر مفاجأة؟</p>
                <button class="action-btn" style="background:#ffc107; color:#000;" onclick="showRamadan()">اضغطي هنا ي عسل 🍯</button>
            </div>
        </div>
    </div>

    <div id="ramadan-screen">
        <span class="moon">🌙</span>
        <h1>رمضان كريم ي اجمل بسمله في الدنيا كلها</h1>
        <div style="font-size: 30px; margin-top: 20px;">✨📿⭐🕌</div>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="tamally.mp3" type="audio/mpeg">
    </audio>

    <script>
        const startDate = new Date("December 14, 2022 00:00:00").getTime();
        const music = document.getElementById('bgMusic');
        const text = "كل سنه وانتي طيبه يا اجمل بسبوسه في الدنيا كلها، وكل رمضان وانتي حبيبتي واختي وبنتي واغلي ماليا.. ربنا يخليكي ليا وميحرمنيش منك ابدا ابدا ويبارك فيكي ويحميكي من كل سوء ومكروه.. اشوفك اشطر دكتورة في الدنيا كلها يارب. بحبك يا اجمل بسبوسه في الدنيا! 🫶🫂";
        let fallType = "heart"; 

        function checkPassword() {
            if (document.getElementById('passwordInput').value === "selem") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                music.play().catch(() => {});
                setInterval(createFallingItem, 400);
            } else { alert("غلط يا بسبوسة! 🧐"); }
        }

        function showLetter() {
            document.getElementById('images-section').style.display = 'none';
            document.getElementById('letter-section').style.display = 'block';
            let i = 0;
            function type() {
                if (i < text.length) {
                    document.getElementById("typewriter").innerHTML += text.charAt(i); i++;
                    setTimeout(type, 50);
                } else { document.getElementById('wish-start-btn').style.display = 'inline-block'; }
            }
            type();
            setInterval(updateCounter, 1000);
        }

        function updateCounter() {
            const diff = new Date().getTime() - startDate;
            document.getElementById("days").innerText = Math.floor(diff / 86400000);
            document.getElementById("hours").innerText = Math.floor((diff % 86400000) / 3600000);
            document.getElementById("minutes").innerText = Math.floor((diff % 3600000) / 60000);
            document.getElementById("seconds").innerText = Math.floor((diff % 60000) / 1000);
        }

        function showWishSection() {
            document.getElementById('letter-section').style.display = 'none';
            document.getElementById('wish-section').style.display = 'block';
        }

        function finishWish() {
            if(document.getElementById('wishText').value.trim() === "") return alert("اكتبي أمنيتك الأول ❤️");
            document.getElementById('wishText').style.display = 'none';
            document.getElementById('send-wish-btn').style.display = 'none';
            document.getElementById('after-wish').style.display = 'block';
        }

        function showRamadan() {
            document.getElementById('main-content').style.display = 'none';
            document.body.style.background = "linear-gradient(135deg, #1a2a6c 0%, #b21f1f 50%, #fdbb2d 100%)";
            document.getElementById('ramadan-screen').style.display = 'block';
            fallType = "ramadan"; // تغيير الأشياء اللي بتقع لفوانيس
        }

        function createFallingItem() {
            const item = document.createElement('div');
            item.classList.add('falling-item');
            if (fallType === "heart") {
                const hearts = ['❤️', '💖', '✨', '🌸'];
                item.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
            } else {
                const ramadanItems = ['🏮', '🌙', '⭐', '🕌', '🏮'];
                item.innerHTML = ramadanItems[Math.floor(Math.random() * ramadanItems.length)];
                item.style.fontSize = "30px";
            }
            item.style.left = Math.random() * 100 + 'vw';
            item.style.animationDuration = Math.random() * 3 + 3 + 's';
            document.body.appendChild(item);
            setTimeout(() => item.remove(), 6000);
        }
    </script>
</body>
</html>
